# Companies House Screener - Streamlit Secrets
# Copy this to secrets.toml and fill in your values
# DO NOT COMMIT this file to Git!

# Supabase database connection string
# Get this from: Supabase Dashboard → Connect → Connection string (Session pooler, port 5432)
DATABASE_URL = "postgresql://postgres.xxxxxxxxxxxxx:[YOUR-PASSWORD]@aws-0-region.pooler.supabase.com:5432/postgres?sslmode=require"

# Restricted SIC codes (comma-separated list)
# Companies with these SIC codes will appear in the "Restricted" section
RESTRICTED_SIC_CODES = "10110,10130,10110,10120,10130,10131,10132"
